[project]
name = "epsilon-boot"
version = "0.1.0"
description = "A general-purpose AI agent workbench"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "contextvars>=2.4",
    "fastapi-sessions>=0.3.2",
    "fastmcp>=2.14.2",
    "langchain>=1.2.3",
    "langchain-community>=0.3.0",
    "langchain-openai>=0.3.0",
    "langgraph>=1.0.6",
    "openai>=2.15.0",
    "openai-agents>=0.6.5",
    "pydantic>=2.12.5",
    "requests>=2.32.5",
    "tavily-python>=0.7.18",
    "uvicorn>=0.30.0",
    "sse-starlette>=2.0.0",
    "pillow>=12.1.0",
    "prometheus-client>=0.24.1",
    "redis>=7.1.0,<7.4.0",
    "httpx>=0.28.1",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.3.2",
    "aiosqlite>=0.22.1",
    "pydantic-settings>=2.12.0",
    "langchain-anthropic>=1.3.4",
    "opentelemetry-api>=1.20.0",
    "opentelemetry-sdk>=1.20.0",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-instrumentation-httpx>=0.41b0",
    "opentelemetry-instrumentation-redis>=0.41b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.41b0",
    "opentelemetry-instrumentation-logging>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20.0",
    "textual>=8.2.7",
    "ddgs>=9.11.4",
    "readability-lxml>=0.8.4.1",
    "portalocker>=3.2.0",
    "deepagents>=0.6.3",
    "tiktoken>=0.12.0",
    "tenacity>=9.0",
    "jsonschema>=4.26.0",
    "ty>=0.0.56",
    "black>=26.5.1",
    "pyrefly>=0.60.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project.scripts]
epsilon = "application.cli.main:main"


[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"application.cli" = ["*.css"]


[dependency-groups]
dev = [
    "pytest>=9.0.2",
    "hypothesis>=6.82.0",
    "pytest-asyncio>=1.3.0",
    "fakeredis>=2.36.0",
    "ruff>=0.15.17",
    "pyright>=1.1.411",
]

[[tool.uv.index]]
url = "https://pypi.org/simple"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF", "ASYNC"]
# RUF001/002/003 检测「歧义 Unicode 字符」，会将中文全角标点（，。：（）等）判为可疑，
# 与本项目强制的中文 docstring/注释规范冲突，故禁用。
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest]
asyncio_mode = "auto"
pythonpath = ["src"]
testpaths = ["test"]

[tool.pyright]
pythonVersion = "3.13"
