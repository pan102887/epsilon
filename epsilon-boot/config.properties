# -------------------------------------------
SERVER_HOST=0.0.0.0
SERVER_PORT=7777
SERVER_DEBUG=false
SERVER_WORKERS=1

# -------------------------------------------
# Redis 配置
# -------------------------------------------
REDIS_HOST=localhost
REDIS_PORT=6379
REDIS_PASSWORD=
REDIS_DB=0

# -------------------------------------------
# MySQL 数据库配置
# -------------------------------------------
DB_HOST=localhost
DB_PORT=3306
DB_USERNAME=root
DB_PASSWORD=
DB_DATABASE=mydb
DB_POOL_SIZE=5
DB_MAX_OVERFLOW=10
DB_POOL_RECYCLE=3600
DB_ECHO=false
DB_HEALTH_CHECK_TIMEOUT=3

# -------------------------------------------
# 请求日志中间件配置
# -------------------------------------------
LOGGING_REQUEST_MAX_BODY_LOG_SIZE=2048
LOGGING_REQUEST_ENABLED=true
LOGGING_REQUEST_BODY_ENABLED=false
LOGGING_RESPONSE_BODY_ENABLED=false
LOGGING_REQUEST_SENSITIVE_HEADERS=authorization,cookie,set-cookie,x-api-key
LOGGING_REQUEST_SENSITIVE_BODY_FIELDS=password,api_key,token,access_token,refresh_token,secret,authorization,cookie

# -------------------------------------------
# 网关/Sidecar 配置
# -------------------------------------------
GATEWAY_BASE_URL=http://localhost:5678
GATEWAY_TIMEOUT=30
GATEWAY_MAX_RETRIES=3

# -------------------------------------------
# 聊天服务 / Agent Loop 配置
# -------------------------------------------
# Agent Loop 最大迭代轮次，LLM 返回 tool_calls 后自动执行工具并回传结果，
# 循环往复直到 LLM 返回纯文本回复或达到此上限。设为 0（或负数）表示不限制轮次，
# 由 token 预算 / 工具超时等其他机制兜底。
CHAT_MAX_TOOL_ROUNDS=0
# 是否启用 function calling（工具调用）功能，设为 false 时退化为普通对话模式
CHAT_TOOL_CALLING_ENABLED=true
# 语义摘要压缩触发 token 数；这是触发阈值，不是上下文预算。
CHAT_COMPACTION_TRIGGER_TOKENS=8000
# 摘要压缩后保留的最近非 system 消息数量。
CHAT_COMPACTION_KEEP_RECENT_MESSAGES=20
# token 估算使用的 tiktoken encoding 名称。
CHAT_COMPACTION_ENCODING=cl100k_base
# 长任务分段自动续跑配置。默认开启；token/duration 为 0 表示不限制。
CHAT_SEGMENT_AUTO_CONTINUE_ENABLED=true
CHAT_SEGMENT_MAX_CONTINUATIONS=8
CHAT_SEGMENT_MAX_TOTAL_TOKENS=0
CHAT_SEGMENT_MAX_DURATION_SECONDS=0
CHAT_SEGMENT_MAX_CONSECUTIVE_PAUSED=2
CHAT_SEGMENT_MAX_NO_PROGRESS_SEGMENTS=2
CHAT_SEGMENT_MAX_REPEATED_TOOL_CALLS=2
# 注意：已不再支持 CHAT_SYSTEM_PROMPT 字段 / 环境变量；默认系统提示词已迁移至
# prompts/chat-default/v<N>.md 资产目录，切换版本请使用下方
# PROMPT_CHAT_DEFAULT_VERSION 键（详见本文件末尾 Prompt Version Registry 块）。

# Human-in-the-loop 工具审批配置，默认关闭以保持既有行为。
# HITL_INTERRUPT_ON 为 JSON object 字符串，按工具名覆盖审批策略。
HITL_ENABLED=false
HITL_INTERRUPT_ON=
HITL_STATE_TTL_SECONDS=3600

# Task Agent Loop 最大迭代轮次，面向任务的 Agent 入口使用。
# LLM 返回 tool_calls 后自动执行工具并回传结果，循环往复直到 LLM 返回纯文本回复或达到此上限。
# 设为 0（或负数）表示不限制轮次，由 token 预算 / 工具超时等其他机制兜底。
TASK_AGENT_MAX_ROUNDS=0
# Task 长任务分段自动续跑配置。默认开启；token/duration 为 0 表示不限制。
TASK_AGENT_SEGMENT_AUTO_CONTINUE_ENABLED=true
TASK_AGENT_SEGMENT_MAX_CONTINUATIONS=8
TASK_AGENT_SEGMENT_MAX_TOTAL_TOKENS=0
TASK_AGENT_SEGMENT_MAX_DURATION_SECONDS=0
TASK_AGENT_SEGMENT_MAX_CONSECUTIVE_PAUSED=2
TASK_AGENT_SEGMENT_MAX_NO_PROGRESS_SEGMENTS=2
TASK_AGENT_SEGMENT_MAX_REPEATED_TOOL_CALLS=2

# -------------------------------------------
# 阶段三后台 Run Runtime 配置
# -------------------------------------------
# 进程内后台 Run worker。默认开启 1 个 worker；如需只暴露 RunApplicationService
# 和存储而不后台推进，可设为 false。
RUN_WORKER_ENABLED=true
RUN_WORKER_COUNT=1
RUN_AUTO_CONTINUE_PAUSED_RUNS=true
RUN_AUTO_CONTINUE_MAX_SEGMENTS=20
# Run 领取租约与心跳。心跳间隔必须小于租约时长；租约过期的未完成 run 会标记为 lost。
RUN_LEASE_SECONDS=60
RUN_HEARTBEAT_INTERVAL_SECONDS=10
# 容量边界。超过排队上限时拒绝创建；超过运行上限时保持 queued。
RUN_MAX_QUEUED_RUNS=100
RUN_MAX_RUNNING_RUNS=2
# 事件保留与事件流长轮询。事件过期后客户端应回退到快照轮询。
RUN_EVENT_MAX_COUNT=1000
RUN_EVENT_TTL_SECONDS=86400
RUN_EVENT_STREAM_WAIT_SECONDS=15.0
# 扫描过期租约并标记 lost 的间隔。
RUN_LOST_SWEEP_INTERVAL_SECONDS=30
# 阶段四持久化 checkpoint 与恢复配置。关闭 checkpoint 时保持阶段三 lost 语义。
RUN_CHECKPOINT_ENABLED=true
RUN_CHECKPOINT_AUTO_RECOVERY_ENABLED=true
RUN_CHECKPOINT_MAX_RECOVERY_ATTEMPTS=3
RUN_CHECKPOINT_MAX_COUNT=200
RUN_CHECKPOINT_TTL_SECONDS=604800
RUN_CHECKPOINT_MAX_PAYLOAD_BYTES=262144
RUN_CHECKPOINT_TOOL_LEDGER_MAX_COUNT=1000
# P0：Run guardrail 运行时收敛写路径，默认开启；关闭时保持当前兼容行为，后续任务再接入具体 recorder 写入。
RUN_GUARDRAIL_RUNTIME_CONVERGENCE_ENABLED=true
# 阶段六 Run 工作流与多 Agent 协作治理配置。默认启用选择能力；
# 无匹配 workflow 时仍走兼容旧路径。
RUN_WORKFLOW_ENABLED=true
RUN_WORKFLOW_DEFAULT_WORKFLOW=
RUN_WORKFLOW_ENABLED_WORKFLOWS=research,code_change,report,batch_processing
RUN_WORKFLOW_MAX_RECURSION_DEPTH=3
RUN_WORKFLOW_MAX_PARALLEL_DELEGATIONS=3
RUN_WORKFLOW_MAX_HANDOFF_COUNT=1
RUN_WORKFLOW_MAX_REVISE_PER_PHASE=1
RUN_WORKFLOW_MAX_CHILD_RUNS=0
RUN_WORKFLOW_RECENT_COLLABORATION_SUMMARY_LIMIT=5
# P2：workflow 角色能力最小权限治理与 child run 编排，默认关闭以保持兼容。
RUN_WORKFLOW_ROLE_CAPABILITY_ENABLED=false
RUN_WORKFLOW_CHILD_RUN_ENABLED=false

# -------------------------------------------
# 模型路由配置
# -------------------------------------------
MODEL_ROUTER_DEFAULT_PROVIDER=qwen
MODEL_ROUTER_ROUTING_STRATEGY=model_prefix
MODEL_ROUTER_DEFAULT_MODEL=qwen3.7-max

# -------------------------------------------
# CLIProxyAPI 代理配置
# CLIProxyAPI (https://github.com/router-for-me/CLIProxyAPI) 是一个
# 将 CLI 订阅转为 OpenAI 兼容 API 的代理工具，默认监听 8317 端口。
# 通过该代理可统一接入 Gemini CLI、Claude Code、智谱 GLM 等模型。
# -------------------------------------------
MODEL_CLIPROXY_ENABLED=true
MODEL_CLIPROXY_PROVIDER_NAME=cliproxy
MODEL_CLIPROXY_API_BASE=http://localhost:8317/v1
# API key must be injected via environment variable or deployment secret.
MODEL_CLIPROXY_API_KEY=
MODEL_CLIPROXY_DEFAULT_MODEL=glm-4.7
MODEL_CLIPROXY_MODELS=glm-4.7
MODEL_CLIPROXY_TEMPERATURE=0.7
MODEL_CLIPROXY_MAX_TOKENS=4096
MODEL_CLIPROXY_TIMEOUT=120
MODEL_CLIPROXY_MAX_RETRIES=2
# 流式工具调用返回空 id 时的策略：
# - recover：生成本地合成 id，继续执行工具，并记录 WARN
# - raise：保持严格校验，抛 InvalidToolCallIdError
MODEL_CLIPROXY_STREAM_TOOL_CALL_ID_STRATEGY=recover

# -------------------------------------------
# 智谱 AI (Zhipu GLM) 提供商配置
# 智谱 AI 开放平台 API，兼容 OpenAI 协议。
# API 文档：https://docs.bigmodel.cn/cn/api/introduction
# -------------------------------------------
MODEL_ZHIPU_ENABLED=true
MODEL_ZHIPU_PROVIDER_NAME=zhipu
MODEL_ZHIPU_API_BASE=https://open.bigmodel.cn/api/paas/v4
# API key must be injected via environment variable or deployment secret.
MODEL_ZHIPU_API_KEY=
MODEL_ZHIPU_DEFAULT_MODEL=glm-4-plus
MODEL_ZHIPU_MODELS=glm-4-plus,glm-4-long,glm-4-flash,glm-4-flashx,glm-4-air,glm-4-airx
MODEL_ZHIPU_TEMPERATURE=0.7
MODEL_ZHIPU_MAX_TOKENS=4096
MODEL_ZHIPU_TIMEOUT=120
MODEL_ZHIPU_MAX_RETRIES=2
# 流式工具调用返回空 id 时的策略：
# - recover：生成本地合成 id，继续执行工具，并记录 WARN
# - raise：保持严格校验，抛 InvalidToolCallIdError
MODEL_ZHIPU_STREAM_TOOL_CALL_ID_STRATEGY=recover

# -------------------------------------------
# 阿里云百炼 (Qwen) 提供商配置
# 通义千问模型，通过 DashScope OpenAI 兼容接口接入。
# API 文档：https://help.aliyun.com/zh/model-studio/developer-reference/use-qwen-by-calling-api
# -------------------------------------------
MODEL_QWEN_ENABLED=true
MODEL_QWEN_PROVIDER_NAME=qwen
MODEL_QWEN_API_BASE=https://dashscope.aliyuncs.com/compatible-mode/v1
# API key must be injected via environment variable or deployment secret.
MODEL_QWEN_API_KEY=
MODEL_QWEN_DEFAULT_MODEL=qwen-plus
MODEL_QWEN_MODELS=qwen-plus,qwen-turbo,qwen-max,qwen-long,qwen3.7-max
MODEL_QWEN_TEMPERATURE=0.7
MODEL_QWEN_MAX_TOKENS=4096
MODEL_QWEN_TIMEOUT=120
MODEL_QWEN_MAX_RETRIES=2
# 流式工具调用返回空 id 时的策略：
# - recover：生成本地合成 id，继续执行工具，并记录 WARN
# - raise：保持严格校验，抛 InvalidToolCallIdError
MODEL_QWEN_STREAM_TOOL_CALL_ID_STRATEGY=recover

# -------------------------------------------
# open-ai
#
# -------------------------------------------
MODEL_OPENAI_ENABLED=true
MODEL_OPENAI_PROVIDER_NAME=openai
MODEL_OPENAI_API_BASE=https://api.openai.com/v1
MODEL_OPENAI_API_KEY=
MODEL_OPENAI_DEFAULT_MODEL=gpt-5.4
MODEL_OPENAI_MODELS=gpt-5.5,gpt-5.4,gpt-4o-mini,gpt-5.1
MODEL_OPENAI_TEMPERATURE=0.7
MODEL_OPENAI_MAX_TOKENS=4096
MODEL_OPENAI_TIMEOUT=120
MODEL_OPENAI_MAX_RETRIES=2
# 官方 OpenAI Provider 默认保持严格校验；兼容 Provider 可按需设置 recover。
MODEL_OPENAI_STREAM_TOOL_CALL_ID_STRATEGY=raise

# -------------------------------------------
# OpenTelemetry 配置
# -------------------------------------------
OTEL_ENABLED=false
OTEL_SERVICE_NAME=epsilon-boot
OTEL_SERVICE_VERSION=0.1.0
OTEL_ENVIRONMENT=development
# OTLP gRPC 导出端点，为空时使用 ConsoleSpanExporter（本地调试）
# 示例：http://localhost:4317（Jaeger / OTel Collector）
OTEL_EXPORTER_ENDPOINT=
OTEL_EXPORTER_INSECURE=true
# 采样策略：always_on / always_off / traceidratio / parentbased_traceidratio
OTEL_TRACES_SAMPLER=parentbased_traceidratio
# 采样比例 0.0~1.0，生产建议 0.1
OTEL_TRACES_SAMPLER_ARG=1.0
# 日志关联（自动注入 trace_id/span_id 到日志记录）
OTEL_LOG_CORRELATION=true
# 各组件自动埋点开关
OTEL_INSTRUMENT_FASTAPI=true
OTEL_INSTRUMENT_HTTPX=true
OTEL_INSTRUMENT_REDIS=true
OTEL_INSTRUMENT_SQLALCHEMY=true

# -------------------------------------------
# Agent 间委派配置
# -------------------------------------------
# 最大委派递归深度，<=0 时回退为默认值 3
AGENT_MAX_DELEGATION_DEPTH=3
# handoff 子 Agent 最大轮次，<=0 表示不限制轮次
AGENT_HANDOFF_MAX_ROUNDS=0
# 是否启用 Agent 委派工具，false 时 ToolRegistry 中不注册 delegate_to_agent
AGENT_DELEGATE_TOOL_ENABLED=true

# -------------------------------------------
# Agent 智能调度与护栏配置
# -------------------------------------------
# 默认 observe 只记录护栏判断，不改变现有执行行为；enforce 才启用硬阻断/审批。
AGENT_GUARDRAILS_ENABLED=true
AGENT_GUARDRAILS_MODE=observe
AGENT_GUARDRAILS_ENFORCE_CRITICAL_TOOLS=true
AGENT_GUARDRAILS_ENFORCE_HIGH_RISK_TOOLS=false
AGENT_GUARDRAILS_MAX_TOTAL_TOKENS=0
AGENT_GUARDRAILS_MAX_DURATION_SECONDS=0
AGENT_GUARDRAILS_MAX_CONTEXT_GROWTH_MESSAGES=0
AGENT_GUARDRAILS_MAX_REPEATED_TOOL_CALLS=2
AGENT_GUARDRAILS_MAX_CONSECUTIVE_FAILURES=3
# 模型价格表 JSON；兼容旧标量 {"qwen-plus":1.5}，以及新对象
# {"qwen-plus":{"prompt_per_1m":0.8,"completion_per_1m":2.0},"glm-4.7":{"total_per_1m":1.5}}。
# 留空表示成本不可用，运行时统计将标记 cost_available=false 且不阻断执行。
AGENT_GUARDRAILS_MODEL_PRICING=

# -------------------------------------------
# Tavily Web 搜索配置
# -------------------------------------------
TAVILY_API_KEY=
TAVILY_SEARCH_MAX_RESULTS=5

# -------------------------------------------
# HTTP 请求工具配置
# -------------------------------------------
HTTP_REQUEST_TIMEOUT=120
HTTP_REQUEST_MAX_RESPONSE_SIZE=51200
HTTP_REQUEST_ENABLED=true

# -------------------------------------------
# Workspace 工作区配置
# -------------------------------------------
# Workspace 后端种类，本期仅支持 local_filesystem
WORKSPACE_BACKEND=local_filesystem
# 工作区根目录的宿主绝对路径；留空时默认使用进程当前工作目录。
# Agent 的文件影响面被锁定在此目录之内。
WORKSPACE_ROOT=
# 是否允许解引用符号链接（解引用后仍必须落在工作区之内），默认 false 更严格
WORKSPACE_FOLLOW_SYMLINKS=false
# 当 WORKSPACE_ROOT 不存在时是否自动创建（含父级），默认 false 触发启动失败
WORKSPACE_CREATE_IF_MISSING=false

# -------------------------------------------
# Shell 命令执行工具配置
# -------------------------------------------
SHELL_EXEC_TIMEOUT=300
SHELL_EXEC_MAX_OUTPUT_SIZE=51200
SHELL_EXEC_ENABLED=true

# -------------------------------------------
# Python 脚本执行工具配置
# -------------------------------------------
PYTHON_EXEC_ENABLED=true
PYTHON_EXEC_TIMEOUT=300
PYTHON_EXEC_MAX_OUTPUT_SIZE=51200
PYTHON_EXEC_MAX_MEMORY_MB=256
PYTHON_EXEC_WORKING_DIR=
PYTHON_EXEC_ALLOWED_MODULES=

# -------------------------------------------
# MCP 协议适配配置（远端 MCP Server 工具桥接）
# -------------------------------------------
# 总开关，默认禁用；置 true 且配置 MCP_SERVERS 后启动期连接并注册远端工具
MCP_ENABLED=false
# 远端 server 集合（JSON），兼容 fastmcp mcpServers 格式。示例（单行）：
#   MCP_SERVERS={"weather": {"url": "https://example.com/mcp"}}
MCP_SERVERS=
# 桥接工具注册名前缀，留空则不加前缀；多 server 或与内置工具重名时建议设置
MCP_TOOL_PREFIX=
# 远端调用超时（秒）
MCP_TIMEOUT=120

# -------------------------------------------
# 后端选择与本地文件持久化（file / redis 对等切换）
# 本期默认后端从 redis 切换为 file：零配置 uv run 启动即可工作。
# 若需恢复 Redis 生产链路，显式设置 SESSION_STORE_BACKEND=redis。
# 安全警告：file 后端仅保证单主机单实例协同，不保证跨主机一致性；
#   - 禁止挂载到 NFS / SMB / OSS FUSE 等网络盘；
#   - 禁止在多容器间通过 Docker volume 共享 LOCAL_PERSISTENCE_ROOT（overlayfs / bind mount 下锁语义未验证）；
#   - 生产集群部署建议显式设为 redis。
# 备注：本期 file 会话后端不设置 TTL；如依赖自动过期语义，显式 SESSION_STORE_BACKEND=redis。
# -------------------------------------------
# 会话存储后端：redis / file，默认 file
SESSION_STORE_BACKEND=file

# 本地持久化根目录；相对路径在运行期规范化为绝对路径。
# 含义：本地会话 JSON 文件落盘的根目录；进程生命周期内不可变。
# ── 会话主状态根目录（local-trace-artifacts 决策 1a，ADR-0006）──
# 留空/注释即启用 USER tier 默认：~/.epsilon/persistence/<project-hash>/
#   （随用户走、跨项目按 project-hash 分区，不污染项目工作区 git status）。
# 显式设置则尊重显式值、不迁移；SESSION_STORE_BACKEND=redis 时本项不生效。
# 旧数据（../.local_persistence/epsilon-boot）不会自动搬迁：可手动拷贝
#   到新默认目录，或显式设置 LOCAL_PERSISTENCE_ROOT=<旧绝对路径> 保留原位置。
# 安全警告：禁止指向 NFS / SMB / OSS FUSE；禁止多容器共享
#   （overlayfs / bind mount 下锁语义未验证）。
# LOCAL_PERSISTENCE_ROOT=

# 目录不存在时是否自动创建（含父级），默认 true，便于 uv run 零配置冷启动。
LOCAL_PERSISTENCE_CREATE_IF_MISSING=true

# 写入时是否调用 fsync；关闭后放弃断电一致性保证（仅开发 / 测试场景建议关闭），默认 true。
LOCAL_PERSISTENCE_FSYNC_ON_WRITE=true

# 获取文件锁的超时时间（毫秒），默认 5000。
LOCAL_PERSISTENCE_LOCK_ACQUIRE_TIMEOUT_MS=5000

# TmpFileSweeper 清理 "*.tmp-*" 半写残留的 mtime 阈值（秒），默认 3600。
# 仅清理 "*.tmp-*" 半写残留，不影响 .json 会话文件寿命（本期会话无 TTL）。
LOCAL_PERSISTENCE_TMP_SWEEP_MAX_AGE_SECONDS=3600

# -------------------------------------------
# 会话存储乐观锁配置（Session_Optimistic_Lock_Cycle）
# 仅 RedisSessionContextAdapter.compare_and_swap 路径生效；
# LocalFileSessionContextAdapter 走 EXCLUSIVE 锁不消费此值。
# -------------------------------------------
# WATCH/MULTI/EXEC 冲突重试上限；>= 0；默认 3。
SESSION_REDIS_CONFLICT_RETRY_MAX=3

# Redis 会话 context 与 session index 的 TTL（秒）；仅 SESSION_STORE_BACKEND=redis 生效。
SESSION_REDIS_TTL_SECONDS=3600

# -------------------------------------------
# Prompt 版本注册（Prompt Version Registry）
# 每个 Prompt 名称对应一个 PROMPT_<NAME_UPPER_SNAKE>_VERSION 键；
# 服务端在启动期一次性扫描 prompts/ 资产目录并按此处配置加载目标版本。
# 切换版本需重启服务：本配置块不支持热更新（设计决策 #5），
# 以保证 prompt_id 在日志 / trace / 响应体中的一致性。
# 取值格式：v<正整数>，如 v1 / v2 / v10；禁止 v0 / v01 / v1.0.0 等 SemVer 风格。
# -------------------------------------------
# Chat 默认系统提示词版本（对应 prompts/chat-default/v<N>.md）
PROMPT_CHAT_DEFAULT_VERSION=v1
# Task 动态模板骨架版本（对应 prompts/task-template/v<N>.md，仅用于审计）
PROMPT_TASK_TEMPLATE_VERSION=v1
# 上下文摘要 Prompt 版本（对应 prompts/context-summary/v<N>.md）
PROMPT_CONTEXT_SUMMARY_VERSION=v1

# ──────────────────────────────────────────────
# LLM API 重试（R1 — llm-and-tool-resilience）
# ──────────────────────────────────────────────
# 重试上限（含首次），默认 1 = 禁用重试。
# 设为 3 表示最多尝试 3 次（初次 + 2 次退避重试）。
# 退避策略：指数随机 jitter，1-30s。
LLM_RETRY_ATTEMPTS=3

# ──────────────────────────────────────────────
# 工具级 Circuit Breaker（R3 — llm-and-tool-resilience）
# ──────────────────────────────────────────────
# 总开关，默认禁用。启用后对所有 ToolRegistry.execute 生效。
TOOL_CB_ENABLED=false
# 连续失败次数达到阈值后进入 OPEN（拒绝调用）。
TOOL_CB_FAILURE_THRESHOLD=5
# OPEN 持续此秒数后进入 HALF_OPEN（放行少量探测）。
TOOL_CB_RECOVERY_TIMEOUT_SECONDS=30
# HALF_OPEN 允许同时探测的最大调用数。
TOOL_CB_HALF_OPEN_MAX_CALLS=1

# 结构化 Agent 追踪（structured-agent-trace）
# ──────────────────────────────────────────────
# 总开关，启用后 ReActAgentAdapter 每轮记录步骤追踪到本地 JSONL 文件。
TRACE_ENABLED=true
# trace 文件存储目录，相对于进程 CWD。
TRACE_STORE_DIR=.epsilon/traces

# ──────────────────────────────────────────────
# 任务产物存储（local-trace-artifacts）
# ──────────────────────────────────────────────
# 总开关，启用后写入方经 ArtifactStorePort 记录任务产物到本地 JSONL 文件；
# 关闭时工厂返回 None，写入方静默跳过（零行为变化）。
ARTIFACT_ENABLED=true

# ──────────────────────────────────────────────
# TUI/CLI 本地文件日志（local-trace-artifacts，ADR-0005）
# ──────────────────────────────────────────────
# 默认开启，落 USER tier ~/.epsilon/<project-hash>/logs/（随用户走、不污染项目工作区），
# 写盘前对敏感字段脱敏；serve 路径不装配，既有 FastAPI 日志链路不受影响。
EPSILON_LOG_TO_FILE=true
# 文件日志级别。
EPSILON_LOG_LEVEL=INFO
# 单个日志文件轮转阈值（字节），默认 10MB。
EPSILON_LOG_ROTATION_MAX_BYTES=10485760
# 轮转保留的历史文件数量，默认 5。
EPSILON_LOG_ROTATION_BACKUP_COUNT=5

# -------------------------------------------
# ID 校验配置
# -------------------------------------------
# 历史会话恢复时遇到 tool_call.id 缺失/空时的兼容策略
# - filter（默认）：过滤违约项，保留剩余合法 tool_calls，并通过 WARN 日志暴露脏数据
# - raise：抛 InvalidToolCallIdError，由 application 层降级（仅在脏数据预期为 0 时启用）
ID_VALIDATION_HISTORY_RESTORE_STRATEGY=filter
