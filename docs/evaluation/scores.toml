# 人工评分源（spec-ai-evaluation）
#
# 本文件由人工维护，对应 `docs/spec/spec-ai-evaluation/design.md` "评分源文件"
# 章节的结构：按 7 个维度分段（键名为 `DimensionId.value`），每段包含：
#   - score：1..5 的整数评分；
#   - rationale：至少 3 句中文评分理由，显式引用该维度 Rubric 中的业界框架；
#   - evidence_refs：至少 3 条，字符串来自 `tests/evaluation/evidence/catalog.py`
#     中 `EvidenceReference.raw` 字段，格式由 `verify_evidence` 校验。
#
# 权重不在本文件出现，由 `tests/evaluation/rubric/dimensions.py.load_rubric`
# 唯一持有，避免人工误改；`scripts/evaluation/aggregate_scores.py` 会按
# 权重计算加权平均写入 `docs/evaluation/scores.json`。
#
# 评分与阶段 4 七份子报告 `docs/evaluation/dimensions/*.md` 的结论保持一致：
# 1=4, 2=4, 3=3, 4=4, 5=3, 6=3, 7=3（加权平均 ≈ 3.50）。

[architecture]
score = 4
rationale = """\
仓库采用 DDD 六边形架构，`container_config.py` 以组合根形式集中装配所有 \
Port→Adapter，自建 DI 容器通过 `_registry` / `_async_resources` 两套注册表 \
明确区分"装配"与"启停"，符合 OpenAI "A Practical Guide to Building Agents — \
Agent design patterns" 对核心 Loop 与 Provider/Tool 解耦的要求。\
Google ADK "Multi-agent architecture patterns" 建议的注册中心与委派入口 \
已通过 `AgentRegistryPort` + `DelegationPort` 落地，异步资源按五段式顺序启停 \
并逆序清理；距离 5 分的差距是缺少机器可读的架构守卫（如 `import-linter`）与 \
Adapter 策略配置化，这些按 Anthropic "Building effective agents" 组合式 \
Workflow 建议是下一步方向。"""
evidence_refs = [
    "epsilon-boot/src/application/container_config.py:1017-1042",
    "epsilon-boot/src/common/container.py:80-98",
    "epsilon-boot/src/application/container_config.py:982-1011",
    "docs/steering/ddd-architecture.md",
]

[agent_core]
score = 4
rationale = """\
`ReActAgentAdapter` 完整实现 ReAct 循环、最大轮次保护、权限拒绝与异常回写 \
`ToolMessage`，契合 Anthropic "Tool use with Claude — Tool definition best \
practices" 对"异常路径模型可感知"的要求；`ScopedToolRegistry.create_scoped_view` \
按 `frozenset` 白名单暴露工具子集，实现 LangChain "LangGraph Agent patterns / \
ReAct architecture" 强调的状态可控与权限隔离。`DelegateToAgentTool` 对 \
`delegation_depth` 做 `next_depth = current + 1 ≤ MAX` 越限校验，`SlidingWindowCompactionAdapter` \
全量保留 SystemMessage + 末尾 N 条非 system 消息，覆盖 Berkeley FCL 对工具 \
选择准确率的判据；4 → 5 的差距是缺少 tool_call / delegation 的端到端 span 与 CI 级回归守卫。"""
evidence_refs = [
    "epsilon-boot/src/infrastructure/agent/react_agent_adapter.py:128-189",
    "epsilon-boot/src/domain/agent/tools.py:331-401",
    "epsilon-boot/src/infrastructure/agent/delegate_to_agent_tool.py:128-142",
    "epsilon-boot/src/infrastructure/chat/sliding_window_compaction_adapter.py:42-64",
]

[model_prompt]
score = 3
rationale = """\
多 Provider 注册、Round-Robin 路由、配置热重载、Prompt 资产目录与版本化注册均已落地，\
满足 OpenAI "A Practical Guide to Building Agents"（Agent design patterns）对 Provider \
解耦的要求，也部分对齐 OpenAI "Function calling best practices" 对工具 schema 复用的建议。\
但 "提示工程"侧仍缺少 Anthropic "Prompt caching — Efficient long-context usage" 推荐的 \
