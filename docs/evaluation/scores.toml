[security]
score = 4
rationale = """\
`ShellExecTool` / `PythonExecTool` 具备环境变量脱敏（`API_KEY` / `PASSWORD` / \
`SECRET` / `TOKEN` / `CREDENTIAL` 前缀）、超时与输出截断、cwd 被 Workspace 锁定 \
以及启动期 `_validate_exec_working_dir` 二次校验；`SymlinkGuard` / `IdentityGuard` \
覆盖符号链接与跨设备身份两类逃逸；`AGENT_MAX_DELEGATION_DEPTH=3` 在运行期与评测 \
样本两侧被同时验证。这与 OpenAI "Function calling best practices"、Google ADK \
"Safety & guardrails"、Anthropic "Building effective agents" 建议的沙箱基线完全 \
一致。距离 5 分差距：缺少 Prompt Injection 防御分层、工具滥用检测告警、凭证轮转 \
runbook，这些都在 OWASP LLM Top 10（LLM01 / LLM02 / LLM09）中有明确要求。"""
evidence_refs = [
    "epsilon-boot/src/infrastructure/tools/shell_exec/shell_exec_tool.py:59-98",
    "epsilon-boot/src/infrastructure/tools/shell_exec/shell_exec_tool.py:217-249",
    "epsilon-boot/src/infrastructure/tools/python_exec/python_exec_tool.py:42-50",
    "epsilon-boot/src/infrastructure/workspace/local_filesystem/_guards.py:31-151",
    "epsilon-boot/src/infrastructure/workspace/local_filesystem/_guards.py:154-215",
    "epsilon-boot/src/application/container_config.py:212-275",
    "epsilon-boot/config.properties:AGENT_MAX_DELEGATION_DEPTH",
]

[reliability]
score = 3
rationale = """\
SSE 流式错误恢复 + `[DONE]` 协议、ReAct 失败路径以 `ToolMessage` 回写、Provider \
